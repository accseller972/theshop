<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Account Showcase</title>
    <style>
        /* Spacey Background */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Arial', sans-serif;
            background: url('images/space-background.jpg') no-repeat center center fixed; /* Use a space-themed background image */
            background-size: cover; /* Cover the entire viewport */
            color: #ffffff;
            min-height: 100vh;
        }

        /* Container for Products */
        .products-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Product Box Styles */
        .product-box {
            background: rgba(40, 40, 40, 0.8); /* Semi-transparent dark background */
            border-radius: 15px;
            padding: 1.5rem;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            text-align: center; /* Center text */
            position: relative; /* For positioning elements */
        }

        /* Unique Box Styling */
        .product-box:nth-child(1) {
            border: 1px solid #00ffdd;
        }

        .product-box:nth-child(2) {
            border: 1px solid #ff00ff;
        }

        .product-box:nth-child(3) {
            border: 1px solid #00ffff;
        }

        .product-box:nth-child(4) {
            border: 1px solid #ffff00;
        }

        .product-image {
            width: 100%; /* Make the image take the full width of the box */
            height: auto; /* Maintain aspect ratio */
            border-radius: 5px; /* Optional: round the corners of the image */
            margin-bottom: 10px; /* Space between image and text */
        }

        .price {
            font-size: 1.5em; /* Increase font size */
            color: #00ffdd; /* Change color to match your theme */
            margin-top: 10px; /* Add some space above the price */
            font-weight: bold; /* Make the price bold */
        }

        /* Modal Styles */
        .modal {
            display: none; /* Hidden by default */
            position: fixed; /* Stay in place */
            z-index: 100; /* Sit on top */
            left: 0;
            top: 0;
            width: 100%; /* Full width */
            height: 100%; /* Full height */
            overflow: auto; /* Enable scroll if needed */
            background-color: rgba(0, 0, 0, 0.8); /* Black w/ opacity */
        }

        .modal-content {
            background-color: #282828;
            margin: 15% auto; /* 15% from the top and centered */
            padding: 20px;
            border: 1px solid #444;
            width: 80%; /* Could be more or less, depending on screen size */
            max-width: 600px;
            border-radius: 10px;
        }

        .close-button {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }

        .close-button:hover, .close-button:focus {
            color: white;
            text-decoration: none;
            cursor: pointer;
        }

        .carousel img {
            width: 100%; /* Make modal images responsive */
            border-radius: 10px; /* Optional: round the corners of the modal image */
        }

        .carousel-button {
            background-color: rgba(0, 0, 0, 0.5);
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .carousel-button:hover {
            background-color: rgba(0, 0, 0, 0. 8);
        }

        /* Hover Effect for Product Boxes */
        .product-box:hover {
            transform: scale(1.05); /* Slightly enlarge the box on hover */
            box-shadow: 0 10px 30px rgba(0,0,0,0.7); /* Enhance shadow on hover */
        }
    </style>
</head>
<body>
    <div class="products-container">
        <div class="product-box">
            <img src="images/img1.jpg" alt="Product 1" class="product-image">
            <p class="price">£19.99</p>
        </div>
        <div class="product-box">
            <img src="images/img2.jpg" alt="Product 2" class="product-image">
            <p class="price">£29.99</p>
        </div>
        <div class="product-box">
            <img src="images/img3.jpg" alt="Product 3" class="product-image">
            <p class="price">£39.99</p>
        </div>
        <div class="product-box">
            <img src="images/img4.jpg" alt="Product 4" class="product-image">
            <p class="price">£49.99</p>
        </div>
    </div>

    <div id="myModal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <div class="carousel">
                <img src="images/img1.jpg" alt="Product 1">
                <button class="carousel-button">Previous</button>
                <button class="carousel-button">Next</button>
            </div>
        </div>
    </div>

    <script>
        // JavaScript for modal functionality
        const modal = document.getElementById("myModal");
        const closeButton = document.querySelector(".close-button");

        document.querySelectorAll('.product-box').forEach(box => {
            box.addEventListener('click', () => {
                modal.style.display = "block";
            });
        });

        closeButton.addEventListener('click', () => {
            modal.style.display = "none";
        });

        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        };
    </script>
</body>
</html>
